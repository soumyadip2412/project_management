# Render Blueprint for the Setu API (Dashboard → New → Blueprint → this repo).
# Values marked `sync: false` are asked for when the Blueprint is created.
services:
  - type: web
    name: project-camp-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/v1/healthcheck/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Two different random secrets, generated by Render (>= 32 characters).
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d
      # Requests arrive through two proxies: Vercel's rewrite, then Render's
      # load balancer. Trusting both hops gives rate limiting the real client IP.
      - key: TRUST_PROXY
        value: "2"
      # MongoDB Atlas connection string (mongodb+srv://…/projectcamp?retryWrites=true&w=majority).
      - key: MONGO_URL
        sync: false
      # The Vercel URL, e.g. https://project-camp.vercel.app (comma-separate several).
      - key: CORS_ORIGIN
        sync: false
      # Frontend pages the emailed links open (the token is appended).
      - key: FORGOT_PASSWORD_REDIRECT_URL
        sync: false
      - key: EMAIL_VERIFICATION_REDIRECT_URL
        sync: false
      # Email (verification + password reset) over SMTP. Without these the app
      # works, but no emails are sent. The free plan blocks ports 25/465/587,
      # so use port 2525, e.g. Brevo: smtp-relay.brevo.com, 2525, your Brevo
      # login, an SMTP key, and a sender address verified in Brevo.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # e.g. Setu <you@gmail.com>; must be a sender verified with the provider.
      - key: MAIL_FROM
        sync: false
