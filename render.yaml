# Render Blueprint for the Project Camp API (Dashboard → New → Blueprint → this repo).
# Values marked `sync: false` are asked for when the Blueprint is created.
services:
  - type: web
    name: project-camp-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/v1/healthcheck/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Two different random secrets, generated by Render (>= 32 characters).
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d
      # Requests arrive through two proxies: Vercel's rewrite, then Render's
      # load balancer. Trusting both hops gives rate limiting the real client IP.
      - key: TRUST_PROXY
        value: "2"
      # MongoDB Atlas connection string (mongodb+srv://…/projectcamp?retryWrites=true&w=majority).
      - key: MONGO_URL
        sync: false
      # The Vercel URL, e.g. https://project-camp.vercel.app (comma-separate several).
      - key: CORS_ORIGIN
        sync: false
      # Frontend pages the emailed links open (the token is appended).
      - key: FORGOT_PASSWORD_REDIRECT_URL
        sync: false
      - key: EMAIL_VERIFICATION_REDIRECT_URL
        sync: false
      # Optional email delivery (Mailtrap / SendGrid SMTP). Without these the
      # app works, but verification and reset emails are not sent.
      - key: MAIL_TRAP_HOST
        sync: false
      - key: MAIL_TRAP_PORT
        sync: false
      - key: MAIL_TRAP_USER
        sync: false
      - key: MAIL_TRAP_PASS
        sync: false
