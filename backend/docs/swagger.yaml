openapi: 3.0.0
info:
  title: Project Camp Backend API
  description: RESTful API service for collaborative project management.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /api/v1/healthcheck:
    get:
      summary: System health check
      description: Returns the health status of the API.
      tags:
        - Healthcheck
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
  /api/v1/auth/register:
    post:
      summary: User Registration
      description: Register a new user in the system.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
              required:
                - fullName
                - username
                - email
                - password
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Invalid input or user already exists
  /api/v1/auth/login:
    post:
      summary: User Login
      description: Authenticate user and receive access and refresh tokens.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                username:
                  type: string
                password:
                  type: string
              required:
                - password
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
