name: Backend CI

on:
  push:
    branches: [backend-dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on known high/critical vulnerabilities in shipped dependencies.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      # No build step: this is plain ESM run directly by node.
      - name: Syntax check
        run: npm run check:syntax

      # Unit tests + API integration tests. The integration tests boot the real
      # app against an in-memory MongoDB (mongodb-memory-server downloads the
      # mongod binary on first run), so no database service is needed.
      - name: Tests
        run: npm test
        env:
          # src/config/env.js exits the process when these are absent.
          ACCESS_TOKEN_SECRET: ci-access-secret
          REFRESH_TOKEN_SECRET: ci-refresh-secret
          NODE_ENV: test
