<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1722" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Setu is a Scrum workspace for teams: a board, backlog, sprints and reports, with a sprint strip that flags risk before a deadline slips." />
    <title>Setu — Scrum project management for teams</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!--
      Runs before React mounts so the correct theme is on <html> for the first
      paint. Without it the app flashes light before hydrating into dark.
      Kept inline and tiny for that reason.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("theme") || "light";
          var dark = pref === "dark" || (pref === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
