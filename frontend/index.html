<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1722" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Setu is a Scrum workspace for teams: a board, backlog, sprints and reports, with a sprint strip that flags risk before a deadline slips." />
    <title>Setu — Scrum project management for teams</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Setu" />
    <meta property="og:title" content="Setu — See sprint risk before it becomes a missed deadline" />
    <meta property="og:description" content="People, Projects, Progress — Together. A Scrum workspace with a board, backlog, sprints and reports." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Setu logo with the tagline People, Projects, Progress — Together." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!--
      Runs before React mounts so the correct theme is on <html> for the first
      paint. Without it the app flashes light before hydrating into dark.
      Kept inline and tiny for that reason.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("theme") || "light";
          var dark = pref === "dark" || (pref === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
