name: Frontend CI

on:
  push:
    branches: [frontend, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # oxlint currently reports warnings only, so this gates on errors.
      # Tighten to `npm run lint -- --deny-warnings` once the remaining
      # warnings are cleared (roadmap P1.1/P1.2).
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
